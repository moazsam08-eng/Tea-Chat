openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stream
    description: Secure Stream Chat token operations
  - name: people
    description: Tea Chat member discovery and profile management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stream/token:
    post:
      operationId: getStreamToken
      tags: [stream]
      summary: Create a Stream Chat token for the signed-in user
      description: Validates the Supabase access token and creates a Stream user token without exposing the Stream secret.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Stream user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamToken"
        "401":
          description: Supabase session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /stream/profile:
    put:
      operationId: updateStreamProfile
      tags: [stream]
      summary: Update the signed-in member's Stream profile
      description: Validates the Supabase access token before changing the member's display name and profile photo in Stream.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Supabase session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: Search Tea Chat members
      description: Returns public member names and profile photos only; email addresses are never included.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 80
          description: Optional name prefix to search for.
        - in: query
          name: ids
          schema:
            type: string
          description: Optional comma-separated member IDs used to resolve existing connections.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        "200":
          description: A page of member profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/People"
        "401":
          description: Supabase session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamToken:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        image:
          type: ["string", "null"]
        token:
          type: string
      required: [userId, name, image, token]
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        image:
          type: [string, "null"]
          maxLength: 2048
      required: [name, image]
    Profile:
      type: object
      properties:
        name:
          type: string
        image:
          type: [string, "null"]
      required: [name, image]
    People:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ProfileWithId"
        nextOffset:
          type: [integer, "null"]
      required: [users, nextOffset]
    ProfileWithId:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties:
            id:
              type: string
          required: [id]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

