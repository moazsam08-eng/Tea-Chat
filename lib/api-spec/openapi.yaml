openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stream
    description: Secure Stream Chat token operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stream/token:
    post:
      operationId: getStreamToken
      tags: [stream]
      summary: Create a Stream Chat token for the signed-in user
      description: Validates the Supabase access token and creates a Stream user token without exposing the Stream secret.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Stream user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamToken"
        "401":
          description: Supabase session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StreamToken:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        image:
          type: ["string", "null"]
        token:
          type: string
      required: [userId, name, image, token]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

